name: baseline
mode: BASELINE
description: Profil diagnostyczny do cyklicznego monitoringu LAN; niskoinwazyjny, bez skryptów broadcast/external/brute/dos/exploit.
base_args:
  - -sT
  - -sV
  - --version-light
  - -T2
  - --top-ports
  - 100
  - --max-retries
  - 1
  - --max-rtt-timeout
  - 1000ms
  - --script-timeout
  - 20s
  - -Pn
base_scripts:
  - banner
  - http-title
  - http-server-header
  - ssl-cert
extended_args:
extended_scripts:
allow_intrusive: false
