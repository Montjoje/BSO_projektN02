# BSO N02 - przykładowa konfiguracja agenta LAN Security Scanner.
# Każde pole może zostać nadpisane zmienną środowiskową BSO_*.

subnets:
  - 192.168.88.0/24

# Dostępne profile: baseline, deep, pentest.
profile: baseline
profile_dir: profiles
output_dir: data
base_timeout_seconds: 300
open_ports_threshold: 8

mail:
  enabled: false
  smtp_host: smtp.gmail.com
  smtp_port: 587
  sender: operator@example.com
  password: CHANGE_ME_APP_PASSWORD
  recipient: admin@example.com
  subject: BSO N02 - raport skanowania sieci LAN
  use_tls: true
  skip_verify: false

runtime:
  # dry_run=true generuje przykładowy raport bez wywoływania nmap; dobre do demonstracji.
  dry_run: false
  no_email: false
  keep_xml: true
  nmap_path: nmap
  # once - pojedynczy skan; daemon - cykliczne skany z poziomu procesu kontenera.
  # Dla RouterOS zgodnie ze sprawozdaniem zalecane jest once + /system scheduler.
  run_mode: once
  interval_minutes: 1440
